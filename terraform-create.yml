# This pipeline provisions infrastructure using Terraform
# Flow: Init → Plan → Apply for TEST environment

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: terraform-project-variables
- name: workingDir
  value: $(System.DefaultWorkingDirectory)/terraform

stages:

# ---------------- PLAN ----------------
- stage: Terraform_Plan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: '$(azurerm_service_connection)'
        backendAzureRmResourceGroupName: '$(ResourceGroupName)'
        backendAzureRmStorageAccountName: '$(StorageAccountName)'
        backendAzureRmContainerName: '$(ContainerName)'
        backendAzureRmKey: '$(Key)'

    - task: TerraformTask@5
      displayName: Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDir)'
        commandOptions: '-var-file=$(System.DefaultWorkingDirectory)/terraform/tf/test.tfvars'
        environmentServiceNameAzureRM: '$(azurerm_service_connection)'


# ---------------- APPLY ----------------
- stage: Terraform_Apply
  displayName: Terraform Apply
  dependsOn: Terraform_Plan
  jobs:
  - deployment: Apply
    displayName: Apply (Approval Required)
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDir)'
              backendServiceArm: '$(azurerm_service_connection)'
              backendAzureRmResourceGroupName: '$(ResourceGroupName)'
              backendAzureRmStorageAccountName: '$(StorageAccountName)'
              backendAzureRmContainerName: '$(ContainerName)'
              backendAzureRmKey: '$(Key)'

          - task: TerraformTask@5
            displayName: Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDir)'
              commandOptions: '-var-file=tf/test.tfvars -auto-approve'
              environmentServiceNameAzureRM: '$(azurerm_service_connection)'